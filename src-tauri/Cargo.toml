[package]
name = "portal-equalizer"
version = "0.1.0"
description = "System-wide equalizer, live spectrum and priority-based audio device switching"
edition = "2021"
rust-version = "1.77"

[lib]
name = "portal_equalizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
windows-core = "0.58"
serde_json = "1"
cpal = "0.15"
rustfft = "6"
winreg = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  # SMTC: now-playing metadata, cover art and transport control.
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
