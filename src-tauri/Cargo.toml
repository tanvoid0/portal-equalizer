[package]
name = "portal-equalizer"
version = "0.2.0"
description = "System-wide equalizer, live spectrum and priority-based audio device switching"
edition = "2021"
rust-version = "1.77"

[lib]
name = "portal_equalizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Closing the window now hides it, so launching the shortcut again must reach
# the running copy rather than start a second one that fights it for the
# default device and the config file.
tauri-plugin-single-instance = "2"
# Updates are pulled from the GitHub release feed and verified against the
# public key in tauri.conf.json - see .github/workflows/release.yml.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
windows-core = "0.58"
serde_json = "1"
cpal = "0.15"
rustfft = "6"
winreg = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Both already in the tree under reqwest/tauri; named here so the PKCE challenge
# and the MusicBrainz rate gate can use them directly.
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell_PropertiesSystem",
  # ShellExecuteW with the "runas" verb: the only way to raise the UAC prompt
  # Equalizer APO's installer and Configurator both need.
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_FunctionDiscovery",
  # DPAPI for the stored Spotify refresh token, and the system CSPRNG the
  # PKCE verifier is drawn from.
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  # SMTC: now-playing metadata, cover art and transport control.
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
